name: Deploy to VPS

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Copy files to VPS
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        USER: ${{ secrets.SSH_VPS_USER }}
        IPV4: ${{ secrets.SSH_VPS_IP }}
      run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 700 ~/.ssh/id_vps_ovh-ed25519
          ssh-keyscan -H "$IPV4" >> ~/.ssh/known_hosts
          rsync -avz -e 'ssh -p 53180' --delete ./ "$USER"@"$IPV4":/var/www/liste-rgesn/