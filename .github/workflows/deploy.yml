name: Deploy to VPS

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      # Important: fetch-depth: 0 si vous avez besoin de l'historique, sinon par défaut c'est 1

    - name: Déployer les fichiers sur le VPS via rsync
      uses: burnett01/rsync-deployments@7.0
      with:
        switches: -avz --delete
        path: ./
        remote_path: /var/www/liste-rgesn/
        remote_host: ${{ secrets.SSH_VPS_IP }}
        remote_user: ${{ secrets.SSH_VPS_USER }}
        remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
        remote_port: ${{ secrets.SSH_VPS_PORT }}